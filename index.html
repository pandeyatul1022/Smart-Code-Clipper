<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>Smart Code Clipper</title>
    <link rel="stylesheet" href="assets/css/popup.css">
    <script src="assets/js/popup.js"></script>
</head>

<body>
    <div class="app-container">
        <header class="app-header">
            <h1>Smart Code Clipper</h1>
            <button id="themeToggle" type="button" aria-label="Switch to dark mode" title="Switch to dark mode">
                <svg class="theme-icon icon-moon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                    <path d="M20.9 13.2A8.5 8.5 0 0 1 10.8 3.1 8.5 8.5 0 1 0 20.9 13.2Z"></path>
                </svg>
                <svg class="theme-icon icon-sun" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                    <circle cx="12" cy="12" r="4"></circle>
                    <path
                        d="M12 2v2m0 16v2M4.93 4.93l1.42 1.42m11.3 11.3 1.42 1.42M2 12h2m16 0h2M4.93 19.07l1.42-1.42m11.3-11.3 1.42-1.42">
                    </path>
                </svg>
            </button>
        </header>
        <label class="single-line-option" for="allowSingleLine">
            <input type="checkbox" id="allowSingleLine">
            <span>Clean a single numbered line</span>
        </label>
        <textarea spellcheck="false" id="codeInput" placeholder="Paste your code here..."></textarea>
        <textarea spellcheck="false" id="codeOutput" placeholder="Modified code will appear here..."
            readonly></textarea>
        <div id="copyStatus" class="copy-status" role="status" aria-live="polite" hidden>
            <svg class="status-icon success-icon" viewBox="0 0 20 20" aria-hidden="true" focusable="false">
                <path d="m4 10 4 4 8-8"></path>
            </svg>
            <svg class="status-icon error-icon" viewBox="0 0 20 20" aria-hidden="true" focusable="false">
                <path d="m5 5 10 10M15 5 5 15"></path>
            </svg>
            <span id="copyStatusText"></span>
        </div>
    </div>
</body>

</html>
